<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>JS DOM phong cách text</title>
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
</head>
<body>
    <p id="text">JavaScript Exercises - w3resource</p>
    <div>
        <button id="jsstyle">Submit</button>
    </div>

    <script>
        $(document).ready(function(){
            
            $("#jsstyle").click(function(){
                
                $("#text").css({
                    "font-size": "24px",
                    "font-family": "Arial",
                    "color": "red"
                });
            });
        });
    </script>
</body>
</html>
