<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chuyển hướng đến đường link</title>
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
</head>
<body>
    <h1>Nhập đường link và nhấn "Submit" để chuyển hướng:</h1>
    <form id="linkForm">
        <input type="text" id="linkInput" placeholder="Nhập đường link">
        <button type="submit">Submit</button>
    </form>

    <script>
    $(document).ready(function() {
        
        $('#linkForm').submit(function(event) {
            event.preventDefault();
            
            var url = $('#linkInput').val();

            if (url) {
                
                if (confirm('Bạn có chắc chắn muốn chuyển đến trang:\n' + url)) {
                    window.location.href = url;
                }
                
            } else {
                alert('Vui lòng nhập một đường link!');
            }
        });
    });
    </script>
</body>
</html>
