<!DOCTYPE html>
<html>
<head>
    <style type="text/css">
        body { margin: 30px; }
    </style>
    <meta charset="utf-8" />
    <title>Remove items from a dropdown list</title>
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
</head>
<body>
    <form>
        <select id="colorSelect">
            <option>Red</option>
            <option>Green</option>
            <option>White</option>
            <option>Black</option>
        </select>
        <input type="button" id="removeBtn" value="Select and Remove">
    </form>

    <script>
        $(document).ready(function() {
            
            $("#removeBtn").click(function() {
                
                $('#colorSelect :selected').remove();
            });
        });
    </script>
</body>
</html>
